syntax = "proto3";

package bomi.model;

option go_package = "github.com/WeilsNovel/bomi/gen/go/bomi/model";
option java_package = "bomi.kotlin";
option java_multiple_files = true;

// 营养素信息（按份量估算）
message NutritionInfo {
  // 热量 kcal
  double calories = 1;
  // 蛋白质 g
  double protein = 2;
  // 脂肪 g
  double fat = 3;
  // 碳水 g
  double carbohydrate = 4;
}

// 用餐类型
enum MealType {
  MEAL_TYPE_UNSPECIFIED = 0;
  BREAKFAST = 1;
  LUNCH = 2;
  DINNER = 3;
  SNACK = 4;
}

// 食物项（AI 识别结果中的单条食物）
message FoodItem {
  // 食物名称
  string name = 1;
  // 估算份量描述，如 "1 个中等大小 / 150g"
  string portion = 2;
  // 营养素（按份量估算）
  NutritionInfo nutrition = 3;
  // AI 置信度 0-1
  double confidence = 4;
}

// 食物识别请求入参（前端 → server）
// 图片先上传 COS 临时桶获取 image_key，再传 key 调识别
message FoodRecognizeRequest {
  // COS 临时图片 key（前端上传后获得）
  string image_key = 1;
  // 用餐类型（可选，用于辅助识别上下文）
  MealType meal_type = 2;
}

// 食物识别响应（server → 前端）
message FoodRecognizeResponse {
  // 识别 ID（本次识别唯一标识，用于关联删除图片）
  string recognize_id = 1;
  // COS 临时图片 key（回传前端，用户确认后调 DeleteRecognizeImage 删除）
  string image_key = 2;
  // 识别到的食物列表
  repeated FoodItem foods = 3;
  // 本次总营养素
  NutritionInfo total_nutrition = 4;
  // AI 识别耗时 ms
  int32 duration_ms = 5;
}

// 删除识别图片请求（用户确认打卡后调用，删除 COS 临时桶原图）
message DeleteRecognizeImageRequest {
  // 要删除的 COS 临时图片 key
  string image_key = 1;
}

// 删除识别图片响应
message DeleteRecognizeImageResponse {
  // 是否删除成功
  bool success = 1;
}

syntax = "proto3";

package bomi.model;

option go_package = "github.com/WeilsNovel/bomi/gen/go/bomi/model";
option java_package = "bomi.kotlin";
option java_multiple_files = true;

// 营养素信息（按份量估算）
message NutritionInfo {
  // 热量 kcal
  double calories = 1;
  // 蛋白质 g
  double protein = 2;
  // 脂肪 g
  double fat = 3;
  // 碳水 g
  double carbohydrate = 4;
}

// 用餐类型
enum MealType {
  MEAL_TYPE_UNSPECIFIED = 0;
  BREAKFAST = 1;
  LUNCH = 2;
  DINNER = 3;
  SNACK = 4;
}

// 食物项（AI 识别结果中的单条食物）
message FoodItem {
  // 食物名称
  string name = 1;
  // 估算份量描述，如 "1 个中等大小 / 150g"
  string portion = 2;
  // 营养素（按份量估算）
  NutritionInfo nutrition = 3;
  // AI 置信度 0-1
  double confidence = 4;
}

// 食物识别请求入参（前端 → server）
message FoodRecognizeRequest {
  // 图片 URL（已上传后），或本次上传的临时标识
  string image_url = 1;
  // 用餐类型
  MealType meal_type = 2;
  // 拍照时间（缺省用服务端时间）
  optional string taken_at = 3;
}

// 食物识别响应（server → 前端）
message FoodRecognizeResponse {
  // 识别 ID（用于关联打卡记录）
  string recognize_id = 1;
  // 识别到的食物列表
  repeated FoodItem foods = 2;
  // 本次总营养素
  NutritionInfo total_nutrition = 3;
  // AI 识别耗时 ms
  int32 duration_ms = 4;
  // 识别日期 YYYY-MM-DD
  string date = 5;
}

// 饮食打卡记录（落库 + 前端展示）
message DietRecordItem {
  int32 id = 1;
  int32 user_id = 2;
  // 用餐类型
  MealType meal_type = 3;
  // 图片 URL
  string image_url = 4;
  // 识别结果摘要
  repeated FoodItem foods = 5;
  // 本次总营养素
  NutritionInfo total_nutrition = 6;
  // 拍照日期 YYYY-MM-DD
  string date = 7;
  // 拍照时间
  string taken_at = 8;
  string created_at = 9;
}

// 打卡列表查询入参
message DietRecordListRequest {
  int32 page_num = 1;
  int32 page_size = 2;
  // 单日筛选 YYYY-MM-DD
  optional string date = 3;
  // 日期范围起
  optional string start_date = 4;
  // 日期范围止
  optional string end_date = 5;
  optional MealType meal_type = 6;
}

// 打卡列表响应
message DietRecordListResponse {
  repeated DietRecordItem list = 1;
  int32 total = 2;
  int32 page_num = 3;
  int32 page_size = 4;
}

// 每餐营养明细
message MealNutrition {
  MealType meal_type = 1;
  NutritionInfo nutrition = 2;
  repeated DietRecordItem records = 3;
}

// 每日营养汇总
message DailyNutritionSummary {
  string date = 1;
  NutritionInfo nutrition = 2;
  // 各餐明细
  repeated MealNutrition meals = 3;
}

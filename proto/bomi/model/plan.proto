syntax = "proto3";

package bomi.model;

import "bomi/enum/common.proto";
import "bomi/model/food.proto";

option go_package = "github.com/WeilsNovel/bomi/gen/go/bomi/model";
option java_package = "bomi.kotlin";
option java_multiple_files = true;

// 计划类型
enum PlanType {
  PLAN_TYPE_UNSPECIFIED = 0;
  // 减脂
  FAT_LOSS = 1;
  // 增肌
  MUSCLE_GAIN = 2;
  // 维持/健康
  MAINTAIN = 3;
}

// 用户健康档案（用于生成计划）
message HealthProfile {
  int32 user_id = 1;
  bomi.enum.Gender gender = 2;
  int32 age = 3;
  // 身高 cm
  double height = 4;
  // 体重 kg
  double weight = 5;
  // 目标体重 kg
  optional double target_weight = 6;
  bomi.enum.ActivityLevel activity_level = 7;
  PlanType plan_type = 8;
}

// 近期营养汇总（App 从本地 DB 聚合，传后端用于 AI 个性化推荐）
// 全部为匿名聚合数字，不含食物明细，后端用完即丢不入库
message RecentNutritionSummary {
  // 近7日平均日均热量 kcal
  optional double avg_daily_calories = 1;
  // 近7日平均日均蛋白质 g
  optional double avg_daily_protein = 2;
  // 近7日平均日均碳水 g
  optional double avg_daily_carbs = 3;
  // 近7日平均日均脂肪 g
  optional double avg_daily_fat = 4;
  // 统计天数（不足7日时按实际天数）
  optional int32 sample_days = 5;
}

// 生成计划请求（前端 → server）
message GeneratePlanRequest {
  // 健康档案
  HealthProfile profile = 1;
  // 近期营养汇总（可选，无则 AI 按通用规则生成）
  optional RecentNutritionSummary recent_nutrition = 2;
}

// 单餐建议
message MealSuggestion {
  // 对应 MealType
  int32 meal_type = 1;
  string suggestion = 2;
  NutritionInfo target_nutrition = 3;
}

// 单日计划
message DayPlan {
  // 第几天
  int32 day = 1;
  // 日期 YYYY-MM-DD
  string date = 2;
  // 当日目标营养素
  NutritionInfo target_nutrition = 3;
  // 三餐建议
  repeated MealSuggestion meals = 4;
}

// 生成计划响应
message GeneratePlanResponse {
  // 计划 ID
  string plan_id = 1;
  // 计划名称
  string plan_name = 2;
  // 计划周期天数
  int32 total_days = 3;
  // 每日目标营养素
  NutritionInfo daily_target = 4;
  // 每日明细
  repeated DayPlan days = 5;
  // AI 生成的整体建议
  string advice = 6;
}

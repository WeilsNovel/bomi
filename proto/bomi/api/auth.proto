syntax = "proto3";

package bomi.api;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "bomi/model/user.proto";

option go_package = "github.com/WeilsNovel/bomi/gen/go/bomi/api";
option java_package = "bomi.kotlin";
option java_multiple_files = true;

// 登录响应包装（微信/手机号/Apple 三种登录共用）
message LoginApiResponse {
  int32 code = 1;
  string message = 2;
  bomi.model.LoginResponse data = 3;
  string trace_id = 4;
  int64 timestamp = 5;
}

// 发送短信验证码响应包装
message SendSmsApiResponse {
  int32 code = 1;
  string message = 2;
  google.protobuf.Empty data = 3;
  string trace_id = 4;
  int64 timestamp = 5;
}

// 认证服务
service AuthService {
  // 微信登录
  rpc WxLogin(bomi.model.WxLoginRequest) returns (LoginApiResponse) {
    option (google.api.http) = {
      post: "/api/auth/wx-login"
      body: "*"
    };
  }

  // 手机号验证码登录
  rpc PhoneLogin(bomi.model.PhoneLoginRequest) returns (LoginApiResponse) {
    option (google.api.http) = {
      post: "/api/auth/phone-login"
      body: "*"
    };
  }

  // Apple 登录（iOS 客户端专用）
  rpc AppleLogin(bomi.model.AppleLoginRequest) returns (LoginApiResponse) {
    option (google.api.http) = {
      post: "/api/auth/apple-login"
      body: "*"
    };
  }

  // 发送短信验证码
  rpc SendSms(bomi.model.SendSmsCodeRequest) returns (SendSmsApiResponse) {
    option (google.api.http) = {
      post: "/api/auth/send-sms"
      body: "*"
    };
  }
}
